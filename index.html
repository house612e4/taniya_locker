<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANIYA'S WORLD</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Poppins:wght@400;600&display=swap');
        
        body { 
            font-family: 'Noto Sans Bengali', 'Poppins', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #0f172a; 
            margin: 0; 
            padding: 0; 
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: 'Noto Sans Bengali', 'Poppins', sans-serif;
        }
        .glass-input::placeholder { 
            color: rgba(255, 255, 255, 0.4); 
            font-family: 'Noto Sans Bengali', 'Poppins', sans-serif; 
        }
        .glass-input:focus { border-color: rgba(255, 255, 255, 0.4); outline: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 0px; height: 0px; background: transparent; }
        
        @keyframes pulse-ring {
          0% { transform: scale(0.8); opacity: 0.5; }
          50% { transform: scale(1.2); opacity: 1; }
          100% { transform: scale(0.8); opacity: 0.5; }
        }
        .animate-pulse-fast { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="text-white">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        const defaultFirebaseConfig = {
          apiKey: "AIzaSyCf_zIDQGrjC5OMo-Px5s5vcmMdZlVMbkM",
          authDomain: "taniya-world.firebaseapp.com",
          projectId: "taniya-world",
          storageBucket: "taniya-world.firebasestorage.app",
          messagingSenderId: "840512527967",
          appId: "1:840512527967:web:e4d88d83f1686b838245ea",
          measurementId: "G-DKJKK3E529"
        };
        
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : "taniya-locker-app";

        const initialSeedDates = [
            { id: "d1", title: "নাহিদা ইয়াছমিন তানিয়া এর জন্মদিন", type: "জন্মদিন", date: "1994-01-30" },
            { id: "d2", title: "প্রথম বিবাহ বার্ষিকী", type: "বিবাহ বার্ষিকী", date: "2012-02-28" }
        ];

        const toEnglishNumber = (str) => {
            if (!str) return '';
            const bengaliToEnglish = { '০': '0', '১': '1', '২': '2', '৩': '3', '৪': '4', '৫': '5', '৬': '6', '৭': '7', '৮': '8', '৯': '9' };
            return String(str).replace(/[০-৯]/g, match => bengaliToEnglish[match]);
        };

        function App() {
          const videoRef = useRef(null);
          const [user, setUser] = useState(null);
          const [isInitializing, setIsInitializing] = useState(true);

          const [authStatus, setAuthStatus] = useState('locked'); 
          const [pinInput, setPinInput] = useState('');
          const [currentView, setCurrentView] = useState('dashboard');
          
          const [actionPinModal, setActionPinModal] = useState({ show: false, action: null, title: '' });
          const [actionPinInput, setActionPinInput] = useState('');
          
          const [passFolderPinModal, setPassFolderPinModal] = useState(false);
          const [passPinInput, setPassPinInput] = useState('');

          const [pins, setPins] = useState({ main: '7371', action: '6137', password: '8019' });

          const [accounts, setAccounts] = useState([]);
          const [transactions, setTransactions] = useState([]);
          const [members, setMembers] = useState([]);
          const [stories, setStories] = useState([]);
          const [dates, setDates] = useState([]);
          const [passwords, setPasswords] = useState([]);
          const [plans, setPlans] = useState([]);

          const [activeModal, setActiveModal] = useState(null);
          const [editingItem, setEditingItem] = useState(null);
          const [financeSubView, setFinanceSubView] = useState('overview');
          
          const [uploadedImage, setUploadedImage] = useState(null);
          const [isSaving, setIsSaving] = useState(false);
          const [modalError, setModalError] = useState('');

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (error) {
                console.error("Auth error:", error);
              }
            };
            initAuth();
            
            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              setIsInitializing(false);
            });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!user) return;

            const getCollectionRef = (colName) => collection(db, 'artifacts', appId, 'users', 'taniya_admin_123', colName);
            const pinRef = doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'settings', 'pins');

            const unsubs = [
              onSnapshot(pinRef, (snap) => {
                if (snap.exists()) setPins(snap.data());
              }, console.error),

              onSnapshot(getCollectionRef('family_members'), (snap) => {
                setMembers(snap.docs.map(d => ({id: d.id, ...d.data()})));
              }, console.error),
              
              onSnapshot(getCollectionRef('important_dates'), (snap) => {
                  const hasSeeded = localStorage.getItem('seeded_dates_taniya');
                  if (snap.empty && !hasSeeded) {
                      setDates(initialSeedDates);
                      localStorage.setItem('seeded_dates_taniya', 'true');
                      initialSeedDates.forEach(d => setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', d.id), d).catch(console.error));
                  } else {
                      setDates(snap.docs.map(d => ({id: d.id, ...d.data()})));
                  }
              }, console.error),

              onSnapshot(getCollectionRef('finance_accounts'), (snap) => setAccounts(snap.docs.map(d => ({id: d.id, ...d.data()}))), console.error),
              onSnapshot(getCollectionRef('finance_transactions'), (snap) => setTransactions(snap.docs.map(d => ({id: d.id, ...d.data()}))), console.error),
              onSnapshot(getCollectionRef('stories'), (snap) => setStories(snap.docs.map(d => ({id: d.id, ...d.data()}))), console.error),
              onSnapshot(getCollectionRef('passwords'), (snap) => setPasswords(snap.docs.map(d => ({id: d.id, ...d.data()}))), console.error),
              onSnapshot(getCollectionRef('future_plans'), (snap) => setPlans(snap.docs.map(d => ({id: d.id, ...d.data()}))), console.error)
            ];

            return () => unsubs.forEach(unsub => unsub());
          }, [user]);

          const handleMainLogin = () => {
            if (toEnglishNumber(pinInput) === toEnglishNumber(pins.main)) {
              if (videoRef.current) {
                  videoRef.current.currentTime = 0;
                  videoRef.current.play().catch(e => console.log("Video error:", e));
              }
              
              setAuthStatus('video');
              setPinInput('');

              setTimeout(() => {
                setAuthStatus('unlocked');
                setCurrentView('dashboard');
                if (videoRef.current) {
                    videoRef.current.pause();
                }
              }, 9000);
            } else {
              setActionPinModal({ show: true, action: null, title: 'ভুল পিন দিয়েছেন' });
            }
          };

          const verifyActionAndExecute = () => {
            if (toEnglishNumber(actionPinInput) === toEnglishNumber(pins.action)) {
              if (actionPinModal.action) actionPinModal.action();
              setActionPinModal({ show: false, action: null, title: '' });
              setActionPinInput('');
            } else {
              setActionPinInput('');
            }
          };

          const requireSecureAction = (actionFn, titleText) => {
            setActionPinModal({ show: true, action: actionFn, title: titleText });
          };

          const openPasswordFolder = () => {
            if (toEnglishNumber(passPinInput) === toEnglishNumber(pins.password)) {
              setPassFolderPinModal(false);
              setPassPinInput('');
              setCurrentView('passwords');
            } else {
              setPassPinInput('');
            }
          };

          const openModal = (type, item = null) => {
            setModalError('');
            setIsSaving(false);
            setEditingItem(item);
            if (type === 'member') setUploadedImage(null);
            setActiveModal(type);
          };

          const saveData = async (collectionName, data, id = null) => {
            setModalError('');
            if (!user) {
              setModalError('ডাটাবেসের সাথে কানেক্ট করা যাচ্ছে না। ফায়ারবেস অথেন্টিকেশন চালু আছে কিনা চেক করুন।');
              return;
            }
            setIsSaving(true);
            try {
              const docId = id || Date.now().toString();
              const docRef = doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', collectionName, docId);
              await setDoc(docRef, data);
              setActiveModal(null);
            } catch (err) {
              console.error(err);
              setModalError('সংরক্ষণ করা যায়নি: ' + err.message);
            } finally {
              setIsSaving(false);
            }
          };

          const deleteData = async (collectionName, id) => {
            if (!user) return;
            requireSecureAction(async () => {
              await deleteDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', collectionName, id));
              if (collectionName === 'family_members') {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', id + '_dob')).catch(e => console.log(e));
                await deleteDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', 'our_marriage_anniversary')).catch(e => console.log(e));
                await deleteDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', id + '_marriage')).catch(e => console.log(e));
                await deleteDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', id + '_death')).catch(e => console.log(e));
              }
            }, 'এই তথ্যটি মুছে ফেলতে চান?');
          };

          const savePins = async (e) => {
            e.preventDefault();
            setModalError('');
            if (!user) {
              setModalError('ডাটাবেসের সাথে কানেক্ট করা যাচ্ছে না। ফায়ারবেস অথেন্টিকেশন চালু আছে কিনা চেক করুন।');
              return;
            }
            setIsSaving(true);
            try {
              const fd = new FormData(e.target);
              const data = Object.fromEntries(fd.entries());
              
              if(data.main) data.main = toEnglishNumber(data.main);
              if(data.action) data.action = toEnglishNumber(data.action);
              if(data.password) data.password = toEnglishNumber(data.password);

              const ref = doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'settings', 'pins');
              await setDoc(ref, data);
              setActiveModal(null);
            } catch (err) {
              console.error(err);
              setModalError('পিন সেভ করা যায়নি: ' + err.message);
            } finally {
              setIsSaving(false);
            }
          };

          const handleImageChange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                setUploadedImage(compressedBase64);
              };
              img.src = event.target.result;
            };
            reader.readAsDataURL(file);
          };

          const formatMoney = (amount) => {
            const englishAmount = toEnglishNumber(amount);
            return `৳ ${Number(englishAmount || 0).toLocaleString('en-IN')}`;
          };

          const getAccountCurrentBalance = (accId) => {
            const acc = accounts.find(a => a.id === accId);
            if (!acc) return 0;
            let currentBalance = Number(toEnglishNumber(acc.balance) || 0);
            transactions.forEach(t => {
                if (t.accountId === accId) {
                    const amount = Number(toEnglishNumber(t.amount) || 0);
                    if (t.type === 'income' || t.type === 'borrowed') currentBalance += amount;
                    if (t.type === 'expense' || t.type === 'lent') currentBalance -= amount;
                }
            });
            return currentBalance;
          };

          const calculateFinance = () => {
            let income = 0;
            let expense = 0;
            let totalBalance = 0;

            transactions.forEach(t => {
              const amount = Number(toEnglishNumber(t.amount) || 0);
              if (t.type === 'income' || t.type === 'borrowed') income += amount;
              if (t.type === 'expense' || t.type === 'lent') expense += amount;
            });
            
            accounts.forEach(a => {
              totalBalance += getAccountCurrentBalance(a.id);
            });

            return { income, expense, totalBalance };
          };

          const relPriority = { 'আমি': 1, 'স্বামী': 2, 'স্বামী সাবেক': 3, 'ছেলে': 4, 'মেয়ে': 4, 'মা': 5, 'বাবা': 5, 'ভাই': 6, 'বোন': 6, 'ভাসুর': 7, 'ননদ': 8 };
          const sortedMembers = [...members].sort((a, b) => (relPriority[a.relation] || 99) - (relPriority[b.relation] || 99));

          if (isInitializing) return <div className="min-h-screen bg-[#0f172a] flex items-center justify-center text-white">লোড হচ্ছে...</div>;

          const renderDashboardCards = () => (
            <div className="grid grid-cols-2 gap-4">
              <div onClick={() => setCurrentView('finance')} className="bg-teal-400/30 border border-teal-200/30 backdrop-blur-xl shadow-lg rounded-[2rem] p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-teal-400/40 active:scale-95 transition-all aspect-[4/3]">
                <h3 className="text-xl md:text-2xl text-white text-center tracking-wide leading-snug drop-shadow-md">অর্থ<br/>ব্যবস্থাপনা</h3>
              </div>
              
              <div onClick={() => setCurrentView('family')} className="bg-pink-500/30 border border-pink-300/30 backdrop-blur-xl shadow-lg rounded-[2rem] p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-pink-500/40 active:scale-95 transition-all aspect-[4/3]">
                <h3 className="text-xl md:text-2xl text-white text-center tracking-wide leading-snug drop-shadow-md">পরিবারের<br/>সদস্য</h3>
              </div>
              
              <div onClick={() => setCurrentView('stories')} className="bg-indigo-600/40 border border-indigo-400/30 backdrop-blur-xl shadow-lg rounded-[2rem] p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-indigo-600/50 active:scale-95 transition-all aspect-[4/3]">
                <h3 className="text-xl md:text-2xl text-white text-center tracking-wide leading-snug drop-shadow-md">স্মরণীয়<br/>গল্প</h3>
              </div>
              
              <div onClick={() => setPassFolderPinModal(true)} className="bg-orange-600/40 border border-orange-400/30 backdrop-blur-xl shadow-lg rounded-[2rem] p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-orange-600/50 active:scale-95 transition-all aspect-[4/3]">
                <h3 className="text-xl md:text-2xl text-white text-center tracking-wide leading-snug drop-shadow-md">প্রয়োজনীয়<br/>পাসওয়ার্ড</h3>
              </div>
              
              <div onClick={() => setCurrentView('dates')} className="bg-amber-500/40 border border-amber-300/30 backdrop-blur-xl shadow-lg rounded-[2rem] p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-amber-500/50 active:scale-95 transition-all aspect-[4/3] relative">
                {dates.length > 0 && <span className="absolute top-4 right-4 w-3 h-3 bg-white rounded-full animate-ping"></span>}
                <h3 className="text-xl md:text-2xl text-white text-center tracking-wide leading-snug drop-shadow-md">স্মরণীয়<br/>তারিখ</h3>
              </div>
              
              <div onClick={() => setCurrentView('plans')} className="bg-emerald-500/30 border border-emerald-300/30 backdrop-blur-xl shadow-lg rounded-[2rem] p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-emerald-500/40 active:scale-95 transition-all aspect-[4/3]">
                <h3 className="text-xl md:text-2xl text-white text-center tracking-wide leading-snug drop-shadow-md">ভবিষ্যৎ<br/>পরিকল্পনা</h3>
              </div>
            </div>
          );

          const renderFinance = () => {
            const { income, expense, totalBalance } = calculateFinance();
            return (
              <div className="space-y-4 max-w-lg mx-auto">
                <div className="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                  <button onClick={() => setFinanceSubView('overview')} className={`px-4 py-2 rounded-full whitespace-nowrap transition-all ${financeSubView==='overview'?'bg-teal-500 text-white shadow-lg':'bg-white/10 border border-white/20 text-white'}`}>ওভারভিউ</button>
                  <button onClick={() => setFinanceSubView('accounts')} className={`px-4 py-2 rounded-full whitespace-nowrap transition-all ${financeSubView==='accounts'?'bg-teal-500 text-white shadow-lg':'bg-white/10 border border-white/20 text-white'}`}>একাউন্টস</button>
                  <button onClick={() => setFinanceSubView('transactions')} className={`px-4 py-2 rounded-full whitespace-nowrap transition-all ${financeSubView==='transactions'?'bg-teal-500 text-white shadow-lg':'bg-white/10 border border-white/20 text-white'}`}>লেনদেন ও ধার</button>
                </div>

                {financeSubView === 'overview' && (
                  <div className="space-y-4">
                    <div className="bg-white/10 backdrop-blur-xl border border-white/20 rounded-[2rem] p-6 text-center shadow-lg">
                      <p className="text-gray-300 text-sm mb-1">মোট আয় (ধার সহ)</p>
                      <h3 className="text-3xl text-emerald-400">{formatMoney(income)}</h3>
                    </div>
                    <div className="bg-white/10 backdrop-blur-xl border border-white/20 rounded-[2rem] p-6 text-center shadow-lg">
                      <p className="text-gray-300 text-sm mb-1">মোট ব্যয় (কাউকে ধার দেওয়া সহ)</p>
                      <h3 className="text-3xl text-rose-400">{formatMoney(expense)}</h3>
                    </div>
                    <div className="bg-teal-500/20 backdrop-blur-xl border border-teal-400/30 rounded-[2rem] p-6 text-center shadow-lg">
                      <p className="text-teal-100 text-sm mb-1">বর্তমান ব্যালেন্স (সব একাউন্ট মিলিয়ে)</p>
                      <h3 className="text-3xl text-white">{formatMoney(totalBalance)}</h3>
                    </div>
                  </div>
                )}

                {financeSubView === 'accounts' && (
                  <div className="space-y-4">
                    <button onClick={() => openModal('account')} className="w-full py-4 bg-teal-500/20 border border-teal-400/30 backdrop-blur-md rounded-xl flex justify-center items-center gap-2 hover:bg-teal-500/40 text-white transition-all shadow-lg"><i className="fas fa-plus"></i> নতুন একাউন্ট</button>
                    {accounts.map(acc => {
                      const currentBal = getAccountCurrentBalance(acc.id);
                      return (
                        <div key={acc.id} className="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-4 flex justify-between items-center shadow-lg">
                          <div>
                            <h4 className="text-white flex items-center gap-2">
                              <i className={`fas ${acc.type === 'bank' ? 'fa-building-columns text-blue-300' : acc.type === 'bkash' ? 'fa-mobile-screen text-pink-300' : 'fa-wallet text-emerald-300'}`}></i> 
                              {acc.name}
                            </h4>
                            <p className="text-xs text-gray-400 mt-1 capitalize">{acc.type}</p>
                          </div>
                          <div className="text-right">
                            <p className="text-lg text-white">{formatMoney(currentBal)}</p>
                            <div className="mt-2">
                                <button onClick={() => requireSecureAction(() => openModal('account', acc), 'একাউন্ট আপডেট করতে চান?')} className="text-xs text-gray-300 hover:text-white px-2"><i className="fas fa-pen"></i></button>
                                <button onClick={() => deleteData('finance_accounts', acc.id)} className="text-xs text-rose-400 hover:text-rose-300 ml-2"><i className="fas fa-trash"></i></button>
                            </div>
                          </div>
                        </div>
                      )
                    })}
                  </div>
                )}

                {financeSubView === 'transactions' && (
                  <div className="space-y-4">
                    <div className="flex gap-2">
                      <button onClick={() => openModal('transaction', {type:'income'})} className="flex-1 py-3 bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 rounded-xl text-sm backdrop-blur-md">আয় যোগ</button>
                      <button onClick={() => openModal('transaction', {type:'expense'})} className="flex-1 py-3 bg-rose-500/20 border border-rose-400/30 text-rose-300 rounded-xl text-sm backdrop-blur-md">ব্যয় যোগ</button>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => openModal('transaction', {type:'borrowed'})} className="flex-1 py-3 bg-amber-500/20 border border-amber-400/30 text-amber-300 rounded-xl text-sm backdrop-blur-md">ধার নিয়েছি</button>

              {activeModal && activeModal !== 'pinSettings' && (

                    </div>

                    <form onSubmit={async (e) => {
                      e.preventDefault();
                      const fd = new FormData(e.target);
                      const data = Object.fromEntries(fd.entries());
                      
                      if(data.amount) data.amount = toEnglishNumber(data.amount);
                      if(data.balance) data.balance = toEnglishNumber(data.balance);
                      if(data.budget) data.budget = toEnglishNumber(data.budget);

                      let collectionName = '';
                      if (activeModal === 'account') collectionName = 'finance_accounts';
                      if (activeModal === 'transaction') collectionName = 'finance_transactions';
                      if (activeModal === 'member') {
                         collectionName = 'family_members';
                         data.imageUrl = uploadedImage || editingItem?.imageUrl || '';
                      }
                      if (activeModal === 'story') collectionName = 'stories';
                      if (activeModal === 'date') collectionName = 'important_dates';
                      if (activeModal === 'password') collectionName = 'passwords';
                      if (activeModal === 'plan') collectionName = 'future_plans';

                      if (activeModal === 'transaction') {
                        const accId = data.accountId;
                        const acc = accounts.find(a => a.id === accId);
                        if(acc) {
                          const amount = Number(data.amount);
                          let newBalance = Number(toEnglishNumber(acc.balance));
                          if (data.type === 'income' || data.type === 'borrowed') newBalance += amount;
                          if (data.type === 'expense' || data.type === 'lent') newBalance -= amount;
                          saveData('finance_accounts', {...acc, balance: String(newBalance)}, acc.id);
                        }
                      }

                      const docId = editingItem ? editingItem.id : Date.now().toString();

                      if (editingItem) {
                        requireSecureAction(async () => {
                          await saveData(collectionName, {...editingItem, ...data}, docId);
                          if (activeModal === 'member') {
                            if (data.dob) await setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', docId + '_dob'), { title: `${data.name} এর জন্মদিন`, type: 'জন্মদিন', date: data.dob });
                            
                            if (data.marriageDate) {
                                const rel = data.relation.trim();
                                if(rel === 'আমি' || rel === 'স্ত্রী' || rel === 'স্বামী' || rel === 'স্বামী সাবেক') {
                                    await setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', 'our_marriage_anniversary'), { title: `আমাদের বিবাহ বার্ষিকী`, type: 'বিবাহ বার্ষিকী', date: data.marriageDate });
                                } else {
                                    await setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', docId + '_marriage'), { title: `${data.name} এর বিবাহ বার্ষিকী`, type: 'বিবাহ বার্ষিকী', date: data.marriageDate });
                                }
                            }
                            
                            if (data.deathDate) await setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', docId + '_death'), { title: `${data.name} এর মৃত্যু বার্ষিকী`, type: 'মৃত্যু বার্ষিকী', date: data.deathDate });
                          }
                        }, 'তথ্য এডিট করতে চান?');
                      } else {
                        await saveData(collectionName, data, docId);
                        if (activeModal === 'member') {
                          if (data.dob) await setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', docId + '_dob'), { title: `${data.name} এর জন্মদিন`, type: 'জন্মদিন', date: data.dob });
                          
                          if (data.marriageDate) {
                                const rel = data.relation.trim();
                                if(rel === 'আমি' || rel === 'স্ত্রী' || rel === 'স্বামী' || rel === 'স্বামী সাবেক') {
                                    await setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', 'our_marriage_anniversary'), { title: `আমাদের বিবাহ বার্ষিকী`, type: 'বিবাহ বার্ষিকী', date: data.marriageDate });
                                } else {
                                    await setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', docId + '_marriage'), { title: `${data.name} এর বিবাহ বার্ষিকী`, type: 'বিবাহ বার্ষিকী', date: data.marriageDate });
                                }
                          }
                          
                          if (data.deathDate) await setDoc(doc(db, 'artifacts', appId, 'users', 'taniya_admin_123', 'important_dates', docId + '_death'), { title: `${data.name} এর মৃত্যু বার্ষিকী`, type: 'মৃত্যু বার্ষিকী', date: data.deathDate });
                        }
                      }
                    }} className="space-y-4">
                      
                      {modalError && (
                        <div className="bg-rose-500/20 border border-rose-500/50 text-rose-200 text-sm p-3 rounded-xl mb-4 text-center">
                          {modalError}
                        </div>
                      )}

                      {activeModal === 'account' && (
                        <>
                          <input name="name" defaultValue={editingItem?.name} placeholder="একাউন্টের নাম (যেমন: ডাচ বাংলা)" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <select name="type" defaultValue={editingItem?.type || 'bank'} className="glass-input w-full rounded-xl p-4 shadow-inner [&>option]:bg-slate-800">
                            <option value="cash">ক্যাশ (নগদ টাকা)</option>
                            <option value="bank">ব্যাংক</option>
                            <option value="bkash">বিকাশ/নগদ</option>
                          </select>
                          <input name="balance" type="text" inputMode="numeric" defaultValue={editingItem?.balance || 0} placeholder="প্রারম্ভিক ব্যালেন্স (অ্যাকাউন্ট খোলার সময়ের ব্যালেন্স)" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                        </>
                      )}

                      {activeModal === 'transaction' && (
                        <>
                          <input name="source" defaultValue={editingItem?.source} placeholder={editingItem?.type==='income'?'আয়ের উৎস (যেমন বেতন)':editingItem?.type==='expense'?'ব্যয়ের নাম (যেমন বাজার)':editingItem?.type==='borrowed'?'কার কাছ থেকে ধার নিয়েছো?':'কাকে ধার দিয়েছো / কোন দোকানে বাকি?'} required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <input name="amount" type="text" inputMode="numeric" defaultValue={editingItem?.amount} placeholder="টাকার পরিমান" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <input name="date" type="date" defaultValue={editingItem?.date || new Date().toISOString().split('T')[0]} required className="glass-input w-full rounded-xl p-4 shadow-inner [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" />
                          <select name="accountId" defaultValue={editingItem?.accountId} required className="glass-input w-full rounded-xl p-4 shadow-inner [&>option]:bg-slate-800">
                            <option value="">কোন একাউন্ট থেকে?</option>
                            {accounts.map(a => <option key={a.id} value={a.id}>{a.name} ({formatMoney(getAccountCurrentBalance(a.id))})</option>)}
                          </select>
                          <textarea name="note" defaultValue={editingItem?.note} placeholder="বিস্তারিত বিবরণ বা বাজারের লিস্ট..." rows={3} className="glass-input w-full rounded-xl p-4 resize-none shadow-inner"></textarea>
                          <input type="hidden" name="type" value={editingItem?.type || 'income'} />
                        </>
                      )}

                      {activeModal === 'member' && (
                        <>
                          <div className="flex flex-col items-center mb-6">
                             <div className="w-28 h-28 rounded-full bg-black/40 border-2 border-dashed border-white/30 flex items-center justify-center overflow-hidden mb-4 relative group shadow-inner">
                                {(uploadedImage || editingItem?.imageUrl) ? (
                                  <img src={uploadedImage || editingItem?.imageUrl} className="w-full h-full object-cover" />
                                ) : (
                                  <i className="fas fa-user text-4xl text-white/30"></i>
                                )}
                                <input type="file" accept="image/*" onChange={handleImageChange} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                             </div>
                             <div className="text-xs text-white bg-white/10 border border-white/20 px-5 py-2.5 rounded-full flex items-center gap-2 tracking-wide shadow-lg">
                                <i className="fas fa-camera"></i> ছবি নির্বাচন করুন
                             </div>
                          </div>
                          <input name="name" defaultValue={editingItem?.name} placeholder="নাম" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <input name="relation" defaultValue={editingItem?.relation} placeholder="সম্পর্ক (আমি, স্বামী, স্ত্রী, ছেলে...)" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          
                          <div className="grid grid-cols-2 gap-2">
                            <div className="relative">
                              <label className="block text-xs text-gray-400 mb-1 ml-1">জন্ম তারিখ (ঐচ্ছিক)</label>
                              <input name="dob" type="date" defaultValue={editingItem?.dob} className="glass-input w-full rounded-xl p-3 shadow-inner [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" />
                            </div>
                            <div className="relative">
                              <label className="block text-xs text-gray-400 mb-1 ml-1">মৃত্যু তারিখ (ঐচ্ছিক)</label>
                              <input name="deathDate" type="date" defaultValue={editingItem?.deathDate} className="glass-input w-full rounded-xl p-3 shadow-inner [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" />
                            </div>
                          </div>
                          
                          <div className="relative">
                            <label className="block text-xs text-gray-400 mb-1 ml-1">বিবাহের তারিখ (ঐচ্ছিক)</label>
                            <input name="marriageDate" type="date" defaultValue={editingItem?.marriageDate} className="glass-input w-full rounded-xl p-4 shadow-inner [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" />
                          </div>

                          <input name="mobile" type="text" inputMode="numeric" defaultValue={editingItem?.mobile} placeholder="মোবাইল নাম্বার" className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <textarea name="note" defaultValue={editingItem?.note} placeholder="বিস্তারিত ঠিকানা, পেশা ইত্যাদি..." rows={4} className="glass-input w-full rounded-xl p-4 resize-none shadow-inner"></textarea>
                        </>
                      )}

                      {activeModal === 'story' && (
                        <>
                          <input name="title" defaultValue={editingItem?.title} placeholder="গল্পের শিরোনাম" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <textarea name="content" defaultValue={editingItem?.content} placeholder="তোমার মনের ভাবগুলো বিস্তারিত লেখো..." rows={6} required className="glass-input w-full rounded-xl p-4 resize-none shadow-inner"></textarea>
                        </>
                      )}

                      {activeModal === 'date' && (
                        <>
                          <input name="title" defaultValue={editingItem?.title} placeholder="কার জন্মদিন বা বিবাহ বার্ষিকী?" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <select name="type" defaultValue={editingItem?.type || 'জন্মদিন'} className="glass-input w-full rounded-xl p-4 shadow-inner [&>option]:bg-slate-800">
                            <option value="জন্মদিন">জন্মদিন</option>
                            <option value="বিবাহ বার্ষিকী">বিবাহ বার্ষিকী</option>
                            <option value="মৃত্যু বার্ষিকী">মৃত্যু বার্ষিকী</option>
                            <option value="অন্যান্য">অন্যান্য</option>
                          </select>
                          <input name="date" type="date" defaultValue={editingItem?.date} required className="glass-input w-full rounded-xl p-4 shadow-inner [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" />
                        </>
                      )}

                      {activeModal === 'password' && (
                        <>
                          <input name="platform" defaultValue={editingItem?.platform} placeholder="প্ল্যাটফর্ম (যেমন: Facebook, Gmail)" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <input name="userId" defaultValue={editingItem?.userId} placeholder="ইউজার আইডি বা ইমেইল" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <input name="password" type="password" defaultValue={editingItem?.password} placeholder="পাসওয়ার্ড" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                        </>
                      )}

                      {activeModal === 'plan' && (
                        <>
                          <input name="title" defaultValue={editingItem?.title} placeholder="পরিকল্পনার নাম (যেমন: সিলেট ট্যুর)" required className="glass-input w-full rounded-xl p-4 shadow-inner" />
                          <textarea name="details" defaultValue={editingItem?.details} placeholder="বিস্তারিত (কবে যাবে, কাদের সাথে ইত্যাদি)..." rows={4} required className="glass-input w-full rounded-xl p-4 resize-none shadow-inner"></textarea>
                          <input name="budget" type="text" inputMode="numeric" defaultValue={editingItem?.budget} placeholder="সম্ভাব্য খরচ (ঐচ্ছিক)" className="glass-input w-full rounded-xl p-4 shadow-inner" />
                        </>
                      )}

                      <div className="flex gap-3 pt-6">
                        <button type="button" onClick={() => setActiveModal(null)} className="flex-1 py-4 bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl text-white transition-all shadow-lg">বাতিল</button>
                        <button type="submit" disabled={isSaving} className="flex-1 py-4 bg-indigo-500/80 hover:bg-indigo-500 border border-indigo-500/50 rounded-xl text-white shadow-lg transition-all disabled:opacity-50">
                          {isSaving ? 'সংরক্ষণ হচ্ছে...' : 'সংরক্ষণ করুন'}
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
